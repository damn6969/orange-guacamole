name: Zoom YouTube Stream

on:
  workflow_dispatch:
    inputs:
      zoom_url:
        description: 'Paste your Zoom Meeting Link'
        required: true
        type: string

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Keeps the server alive for exactly 6 hours
    steps:
      - name: 1. Install Server Dependencies
        run: |
          sudo apt-get update -qq
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq xvfb openbox pulseaudio pulseaudio-utils ffmpeg x11vnc novnc python3-websockify x11-xserver-utils ./google-chrome-stable_current_amd64.deb
          
      - name: 2. Configure Virtual Display & Audio
        run: |
          pulseaudio --start --exit-idle-time=-1 2>/dev/null || true
          pactl load-module module-null-sink sink_name=VirtualSpeaker || true
          pactl set-default-sink VirtualSpeaker
          pactl set-sink-mute VirtualSpeaker 0
          pactl set-sink-volume VirtualSpeaker 100%
          
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -noxdamage -wait 50 -defer 50 -bg -quiet
          /usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900 &
          openbox &

      - name: 3. Launch Zoom & Web Viewer (Cloudflare)
        run: |
          export DISPLAY=:99
          mkdir -p /tmp/zoom_clean
          cat << 'EXT' > /tmp/zoom_clean/manifest.json
          {"manifest_version": 3, "name": "Zoom Clean View", "version": "4.0", "content_scripts": [{"matches": ["*://*.zoom.us/*"], "js": ["clean.js"], "all_frames": true, "run_at": "document_start"}]}
          EXT
          
          cat << 'JS' > /tmp/zoom_clean/clean.js
          if (/\/(j|w|s)\/\d+/.test(location.pathname) && !location.pathname.includes('/wc/')) { location.replace(location.href.replace(/\/(j|w|s)\/(\d+)/, '/wc/$2/join')); }
          window.addEventListener('DOMContentLoaded', () => { const style = document.createElement('style'); style.innerHTML = \`[class*="chat-priview"], [class*="chat-preview"], [class*="notification"], [class*="toast"], [role="alert"] { display: none !important; opacity: 0 !important; visibility: hidden !important; } html.zm-clean footer, html.zm-clean #foot-bar, html.zm-clean [class*="footer"], html.zm-clean [id*="footer"], html.zm-clean header, html.zm-clean #header_container, html.zm-clean [class*="header"], html.zm-clean [class*="top-bar"], html.zm-clean [class*="meeting-info"], html.zm-clean .full-screen-widget { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }\`; document.head.appendChild(style); let timer; const showUI = () => { document.documentElement.classList.remove('zm-clean'); clearTimeout(timer); timer = setTimeout(() => document.documentElement.classList.add('zm-clean'), 3000); }; window.addEventListener('mousemove', showUI, { passive: true }); window.addEventListener('keydown', showUI, { passive: true }); timer = setTimeout(() => document.documentElement.classList.add('zm-clean'), 3000); });
          JS
          
          WEB_URL=$(echo "${{ inputs.zoom_url }}" | sed -E -e 's|/(j|w|s)/([0-9]+)|/wc/\2/join|g' -e 's|#success||g' -e 's|&fromPWA=1||g')
          google-chrome --no-sandbox --disable-gpu --no-first-run --start-maximized --window-size=1280,720 --alsa-output-device=pulse --autoplay-policy=no-user-gesture-required --use-fake-ui-for-media-stream --use-fake-device-for-media-stream --load-extension=/tmp/zoom_clean "$WEB_URL" > /dev/null 2>&1 &
          
          wget -q -nc https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          nohup ./cloudflared-linux-amd64 tunnel --url http://localhost:6080 > tunnel.log 2>&1 &
          sleep 6
          echo "=================================================================="
          grep -o "https://[a-zA-Z0-9.-]*\.trycloudflare\.com" tunnel.log | head -n 1 | awk '{print "👉 OPEN VNC TO JOIN MEETING: " $1 "/vnc.html?autoconnect=true&resize=scale"}'
          echo "=================================================================="

      - name: 4. Keep Audio Routed & Broadcast to YouTube
        run: |
          export DISPLAY=:99
          
          # Route audio every 5 seconds in the background
          (while true; do
            for id in $(pactl list short sink-inputs | awk '{print $1}'); do
              pactl move-sink-input "$id" VirtualSpeaker 2>/dev/null || true
            done
            sleep 5
          done) &

          # Start streaming (This loop blocks the job so it stays alive)
          while true; do
            echo "🚀 Continuous Streaming to YouTube..."
            ffmpeg -loglevel warning -stats -thread_queue_size 4096 -probesize 10M -analyzeduration 2M \
              -f x11grab -draw_mouse 0 -framerate 30 -video_size 1280x720 -i :99.0+0,0 \
              -thread_queue_size 4096 -f pulse -ac 2 -i VirtualSpeaker.monitor \
              -map 0:v -map 1:a \
              -c:v libx264 -preset veryfast -tune zerolatency -threads 0 \
              -x264-params "ref=1:subme=0:me=dia:trellis=0:rc-lookahead=0:sync-lookahead=0" \
              -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 60 -bf 0 -fps_mode cfr \
              -af "aresample=async=1:first_pts=0" -c:a aac -b:a 128k -ar 44100 \
              -flags +global_header \
              -f fifo -fifo_format flv -queue_size 600 \
              -drop_pkts_on_overflow 1 -attempt_recovery 1 -recovery_wait_time 1 -recover_any_error 1 \
              -format_opts flvflags=no_duration_filesize:rw_timeout=5000000 \
              "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}"
            
            echo "⚠️ FFmpeg exited. Restarting in 2 seconds..."
            sleep 2
          done
